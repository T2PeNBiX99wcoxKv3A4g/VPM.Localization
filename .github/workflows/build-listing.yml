name: Build Repo Listing

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ Build Release ]
    types:
      - completed
  release:
    types: [ published, created, edited, unpublished, deleted, released ]

# The listing never touches the Actions cache, and `workflow_run` may only read it
cache-mode: none

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-listing:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/vpm_listing.yml@main
    with:
      current_package_name: io.github.ykysnk.localization
    secrets: inherit
